<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vivek Patil – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0A0F1E;
    --bg2: #0D1428;
    --bg3: #111827;
    --surface: #131C30;
    --surface2: #192038;
    --border: #1E2D4A;
    --accent: #3B82F6;
    --accent2: #60A5FA;
    --accent3: #7C3AED;
    --green: #10B981;
    --orange: #F59E0B;
    --red: #EF4444;
    --text: #E2E8F0;
    --text2: #94A3B8;
    --text3: #64748B;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --glow: 0 0 40px rgba(59,130,246,0.15);
    --glow-strong: 0 0 60px rgba(59,130,246,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,15,30,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  .nav-logo span { color: var(--text); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text2);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent2); }
  .nav-links .num { color: var(--accent); margin-right: 4px; }
  .nav-social { display: flex; gap: 0.75rem; }
  .nav-social a {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    text-decoration: none;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .nav-social a:hover { border-color: var(--accent); color: var(--accent); }

  /* SECTIONS */
  section { padding: 100px 0 60px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

  /* HERO */
  #hero {
    min-height: 100vh;
    display: flex; align-items: center;
    padding-top: 60px;
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
  .hero-eyebrow {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 12px;
  }
  .hero-eyebrow::before {
    content: '';
    display: block; width: 40px; height: 1px;
    background: var(--accent);
  }
  h1.hero-name {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  h1.hero-name .accent { color: var(--accent); }
  .hero-role {
    font-family: var(--mono);
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: var(--text2);
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .hero-role .tag {
    color: var(--green);
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.2);
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    margin-right: 6px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .hero-stats {
    display: flex; gap: 2.5rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
  }
  .stat-box {
    display: flex; flex-direction: column;
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
  }
  .stat-num {
    font-family: var(--mono);
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent2);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .hero-cta { display: flex; gap: 1rem; flex-wrap: wrap; }
  .btn-primary {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.75rem 1.75rem;
    background: var(--accent);
    color: #fff;
    border: none; border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); box-shadow: var(--glow); }
  .btn-outline {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.75rem 1.75rem;
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-outline:hover { background: rgba(59,130,246,0.08); transform: translateY(-2px); }

  /* CODE TERMINAL */
  .hero-terminal {
    position: absolute; right: 2rem; top: 50%; transform: translateY(-50%);
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--glow);
    font-family: var(--mono);
    display: none;
  }
  @media (min-width: 1100px) { .hero-terminal { display: block; } }
  .term-header {
    background: var(--surface2);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .term-dot { width: 10px; height: 10px; border-radius: 50%; }
  .term-dot.red { background: #EF4444; }
  .term-dot.yellow { background: #F59E0B; }
  .term-dot.green { background: #10B981; }
  .term-title { font-size: 0.7rem; color: var(--text3); margin-left: 8px; }
  .term-body { padding: 1rem 1.25rem; font-size: 0.75rem; line-height: 1.8; }
  .term-line { display: flex; gap: 8px; }
  .term-prompt { color: var(--green); }
  .term-cmd { color: var(--accent2); }
  .term-out { color: var(--text2); padding-left: 1rem; }
  .term-key { color: var(--orange); }
  .term-val { color: var(--green); }
  .term-cursor {
    display: inline-block; width: 8px; height: 14px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  /* SECTION HEADER */
  .section-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1; max-width: 60px; height: 1px;
    background: var(--accent);
  }
  h2.section-title {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 3rem;
  }
  h2.section-title em { font-style: normal; color: var(--accent2); }

  /* SKILLS */
  #skills { background: var(--bg2); }
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    transition: all 0.3s;
  }
  .skill-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--glow); }
  .skill-cat {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 8px;
  }
  .skill-cat svg { flex-shrink: 0; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .skill-tag {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text2);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .skill-tag:hover { color: var(--accent2); border-color: var(--accent); }

  /* PROJECTS */
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    cursor: default;
  }
  .project-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent));
  }
  .project-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.4); border-color: var(--card-accent, var(--accent)); }
  .project-num {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    margin-bottom: 0.75rem;
  }
  .project-name {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.25rem;
  }
  .project-sub {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text3);
    margin-bottom: 1rem;
  }
  .project-desc {
    font-size: 0.85rem;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 1rem;
  }
  .project-highlights { margin-bottom: 1.25rem; }
  .project-highlight {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text2);
    padding: 3px 0;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .project-highlight::before { content: '→'; color: var(--card-accent, var(--accent)); flex-shrink: 0; }
  .project-stack { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .stack-chip {
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 3px 8px;
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 3px;
    color: var(--accent2);
    letter-spacing: 0.03em;
  }

  /* EXPERIENCE */
  #experience { background: var(--bg2); }
  .exp-list { display: flex; flex-direction: column; gap: 1.5rem; }
  .exp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.75rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.5rem;
    transition: all 0.3s;
  }
  .exp-card:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .exp-icon {
    width: 44px; height: 44px;
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
  }
  .exp-type {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .exp-role {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.2rem;
  }
  .exp-org { font-size: 0.85rem; color: var(--text2); margin-bottom: 0.5rem; }
  .exp-period {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text3);
    margin-bottom: 0.75rem;
  }
  .exp-points { list-style: none; }
  .exp-points li {
    font-size: 0.83rem;
    color: var(--text2);
    padding: 3px 0;
    display: flex; gap: 8px; align-items: flex-start;
    line-height: 1.5;
  }
  .exp-points li::before { content: '▸'; color: var(--accent); flex-shrink: 0; margin-top: 1px; }

  /* ACHIEVEMENTS */
  .achievements-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  .ach-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    display: flex; gap: 1rem; align-items: flex-start;
    transition: all 0.3s;
  }
  .ach-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .ach-icon { font-size: 1.75rem; flex-shrink: 0; }
  .ach-title { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 0.2rem; }
  .ach-desc { font-size: 0.78rem; color: var(--text2); line-height: 1.4; }

  /* EDUCATION */
  #education { background: var(--bg2); }
  .edu-list { display: flex; flex-direction: column; gap: 1rem; }
  .edu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    display: flex; justify-content: space-between; gap: 1rem;
    align-items: flex-start;
    transition: all 0.3s;
    flex-wrap: wrap;
  }
  .edu-card:hover { border-color: var(--accent); }
  .edu-degree { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
  .edu-inst { font-size: 0.83rem; color: var(--text2); margin-bottom: 0.2rem; }
  .edu-courses {
    display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem;
  }
  .edu-course {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 3px;
  }
  .edu-right { text-align: right; flex-shrink: 0; }
  .edu-period { font-family: var(--mono); font-size: 0.7rem; color: var(--text3); margin-bottom: 0.4rem; }
  .edu-score {
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent2);
  }

  /* CERTS */
  .certs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
  .cert-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    transition: all 0.2s;
  }
  .cert-card:hover { border-color: var(--accent); }
  .cert-name { font-size: 0.88rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem; }
  .cert-org { font-size: 0.78rem; color: var(--text2); margin-bottom: 0.2rem; }
  .cert-date { font-family: var(--mono); font-size: 0.68rem; color: var(--text3); }

  /* CONTACT / FOOTER */
  #contact { background: var(--bg); border-top: 1px solid var(--border); text-align: center; }
  .contact-title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
  }
  .contact-sub { font-size: 1rem; color: var(--text2); margin-bottom: 2.5rem; max-width: 500px; margin-left: auto; margin-right: auto; }
  .contact-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
  .contact-link {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text2);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 0.65rem 1.25rem;
    border-radius: 8px;
    transition: all 0.2s;
  }
  .contact-link:hover { border-color: var(--accent); color: var(--accent2); }
  .footer-copy {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text3);
    border-top: 1px solid var(--border);
    padding-top: 2rem;
  }
  .footer-copy a { color: var(--accent2); text-decoration: none; }

  /* ACTIVE NAV */
  .nav-links a.active { color: var(--accent2); }

  /* Loading */
  .loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 80px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text3);
    gap: 8px;
  }
  .spin {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .exp-card { grid-template-columns: 1fr; }
    nav .nav-links { display: none; }
    h1.hero-name { font-size: 3rem; }
  }

  /* fade-in animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.6s ease forwards; }
  .fade-up-d1 { animation-delay: 0.1s; opacity: 0; animation-fill-mode: both; }
  .fade-up-d2 { animation-delay: 0.2s; opacity: 0; animation-fill-mode: both; }
  .fade-up-d3 { animation-delay: 0.3s; opacity: 0; animation-fill-mode: both; }
  .fade-up-d4 { animation-delay: 0.4s; opacity: 0; animation-fill-mode: both; }
  .fade-up-d5 { animation-delay: 0.5s; opacity: 0; animation-fill-mode: both; }

  /* Typing cursor for hero */
  .typing-line { display: inline; }
  .typed-cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
</style>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Typing animation hook ──────────────────────────────────
function useTyping(words, speed = 80, pause = 1800) {
  const [text, setText] = useState('');
  const [wordIdx, setWordIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const cur = words[wordIdx];
    const delay = deleting ? speed / 2 : speed;
    const t = setTimeout(() => {
      if (!deleting && text === cur) {
        setTimeout(() => setDeleting(true), pause);
        return;
      }
      if (deleting && text === '') {
        setDeleting(false);
        setWordIdx(i => (i + 1) % words.length);
        return;
      }
      setText(deleting ? cur.slice(0, text.length - 1) : cur.slice(0, text.length + 1));
    }, delay);
    return () => clearTimeout(t);
  }, [text, deleting, wordIdx]);
  return text;
}

// ── Fetch hook ─────────────────────────────────────────────
function usePortfolio() {
  const [data, setData] = useState(null);
  useEffect(() => {
